[package]
name = "tms_authenticator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13.2", features = ["form"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }