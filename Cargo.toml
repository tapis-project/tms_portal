[package]
name = "tms_portal"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12.5", features = ["cookie", "cookie-private", "typed-header"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["default"] }
reqwest = { version = "0.13.2", features = ["form"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }

# this seems broken:
#jsonwebtoken = { version = "10.3.0", default-features = false, features = ["aws_lc_rs"] }

url = "2.5.8"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "time", "uuid"] }
thiserror = "2.0.18"
anyhow = "1.0.102"
uuid = { version = "1.22.0", features = ["v4"] }
tower-http = { version = "0.6.8", features = ["trace", "fs"] }
tracing = "0.1.44"
pin-project = "1.1.11"
tracing-subscriber = "0.3.23"
base64 = "0.22.1"
jwtk = { version = "0.5.0", features = ["openssl"] }
http = "1.4.2"

# had to run this command to get the build to work.  I guess there are issues with 0.3.48 with cookies library.
# this will fix it.
# cargo update -p time --precise 0.3.47
